<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simtec Robot — Wave Hi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a12; overflow:hidden; font-family:sans-serif; }
  canvas { display:block; }
  #info { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    color:rgba(0,220,255,0.45); font-size:11px; letter-spacing:3px;
    text-transform:uppercase; pointer-events:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:18px;
    background:#0a0a12; color:#00dcff; font-size:13px; letter-spacing:3px;
    text-transform:uppercase; transition:opacity 0.8s; }
  .bar-outer { width:220px; height:2px; background:rgba(0,220,255,0.15); border-radius:2px; }
  .bar-inner  { height:100%; width:0%; background:#00dcff; border-radius:2px; transition:width 0.3s; }
</style>
</head>
<body>
<div id="loading">
  <div id="load-msg">Loading robot…</div>
  <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
</div>
<div id="info">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.toneMapping     = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 0.08, 3.8);

scene.add(new THREE.AmbientLight(0x223355, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(1.5, 2.5, 3);
scene.add(key);
const cyan = new THREE.PointLight(0x00dcff, 3.2, 9);
cyan.position.set(-1.5, 0.6, 2);
scene.add(cyan);
const pink = new THREE.PointLight(0xff3cbe, 2.2, 9);
pink.position.set(1.5, -0.4, 1.5);
scene.add(pink);

const glowMesh = new THREE.Mesh(
  new THREE.CircleGeometry(0.9, 64),
  new THREE.MeshBasicMaterial({ color: 0x00dcff, transparent: true, opacity: 0.06 })
);
glowMesh.rotation.x = -Math.PI / 2;
glowMesh.position.y = -1.03;
scene.add(glowMesh);

let mixer = null, robotRoot = null;
let rotY = 0, rotX = 0.04, isDragging = false, prevX = 0, prevY = 0;

const loader = new THREE.GLTFLoader();
loader.load('robot_wave.glb',
  (gltf) => {
    robotRoot = gltf.scene;
    scene.add(robotRoot);
    if (gltf.animations.length > 0) {
      let skinned = null;
      robotRoot.traverse(n => { if (n.isSkinnedMesh) skinned = n; });
      const target = skinned || robotRoot;
      mixer = new THREE.AnimationMixer(target);
      const action = mixer.clipAction(gltf.animations[0], target);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
    }
    const el = document.getElementById('loading');
    el.style.opacity = '0';
    setTimeout(() => el.style.display = 'none', 700);
  },
  (p) => { if (p.total) document.getElementById('bar').style.width = (p.loaded/p.total*100)+'%'; },
  (e) => { document.getElementById('load-msg').textContent = 'Error: ' + e.message; }
);

const el = renderer.domElement;
el.addEventListener('mousedown',  e => { isDragging=true; prevX=e.clientX; prevY=e.clientY; });
el.addEventListener('mouseup',    () => isDragging=false);
el.addEventListener('mousemove',  e => {
  if (!isDragging) return;
  rotY += (e.clientX-prevX)*0.008; prevX=e.clientX;
  rotX  = Math.max(-0.5, Math.min(0.5, rotX+(e.clientY-prevY)*0.004)); prevY=e.clientY;
});
el.addEventListener('wheel', e => {
  camera.position.z = Math.max(1.5, Math.min(6, camera.position.z+e.deltaY*0.005));
}, { passive: true });

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (mixer) mixer.update(dt);
  if (robotRoot) { robotRoot.rotation.y = rotY; robotRoot.rotation.x = rotX; }
  cyan.intensity  = 2.8 + Math.sin(t*1.4)*0.9;
  pink.intensity  = 1.8 + Math.sin(t*1.9+1)*0.7;
  glowMesh.material.opacity = 0.05 + Math.sin(t*1.2)*0.025;
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
