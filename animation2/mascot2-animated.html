<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simtec Mascot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 420px;
    height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ─── Ambient glow ring ─── */
  .glow-ring {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(ellipse,
      rgba(0, 220, 255, 0.04) 0%,
      rgba(255, 60, 190, 0.02) 50%,
      transparent 70%
    );
    animation: ring-idle 5s ease-in-out infinite;
    pointer-events: none;
    transition: width 0.6s ease, height 0.6s ease;
  }

  .scene:hover .glow-ring {
    width: 340px;
    height: 340px;
    animation: ring-hover 2.5s ease-in-out infinite;
  }

  @keyframes ring-idle {
    0%, 100% { transform: scale(1);    opacity: 0.6; }
    50%       { transform: scale(1.05); opacity: 0.9; }
  }

  @keyframes ring-hover {
    0%, 100% { transform: scale(1);    opacity: 0.9; }
    50%       { transform: scale(1.08); opacity: 1;   }
  }

  /* ─── Robot wrapper (receives JS drag rotation) ─── */
  .robot-wrapper {
    position: relative;
    z-index: 2;
    transform-origin: center center;
    transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: grab;
  }

  .robot-wrapper.dragging {
    cursor: grabbing;
    transition: none;
  }

  /* ─── Robot (receives CSS float + glow animations) ─── */
  .robot {
    display: block;
    width: 320px;
    transform-origin: center bottom;
    animation: float-idle 5s ease-in-out infinite,
               glow-idle  4.5s ease-in-out infinite;
  }

  .scene:hover .robot {
    animation: float-hover 2.2s ease-in-out infinite,
               glow-hover  2s ease-in-out infinite;
  }

  /* Idle: barely perceptible */
  @keyframes float-idle {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50%       { transform: translateY(-8px) rotate(0.3deg); }
  }

  @keyframes glow-idle {
    0%, 100% {
      filter: drop-shadow(0 0 3px rgba(0, 220, 255, 0.28))
              drop-shadow(0 0 8px rgba(255, 60, 190, 0.10));
    }
    50% {
      filter: drop-shadow(0 0 6px rgba(0, 220, 255, 0.45))
              drop-shadow(0 0 12px rgba(255, 60, 190, 0.18));
    }
  }

  /* Hover: noticeably more alive, but composed */
  @keyframes float-hover {
    0%, 100% { transform: translateY(0px)   rotate(-0.8deg); }
    40%       { transform: translateY(-18px) rotate(1.2deg);  }
    70%       { transform: translateY(-10px) rotate(0.4deg);  }
  }

  @keyframes glow-hover {
    0%, 100% {
      filter: drop-shadow(0 0 10px rgba(0, 220, 255, 0.75))
              drop-shadow(0 0 24px rgba(0, 220, 255, 0.30))
              drop-shadow(0 0 6px  rgba(255, 60, 190, 0.45));
    }
    50% {
      filter: drop-shadow(0 0 14px rgba(0, 220, 255, 0.90))
              drop-shadow(0 0 32px rgba(0, 220, 255, 0.40))
              drop-shadow(0 0 8px  rgba(255, 60, 190, 0.60));
    }
  }

  /* ─── Ground shadow ─── */
  .shadow {
    position: absolute;
    bottom: 28px;
    left: 50%;
    width: 190px;
    height: 20px;
    background: radial-gradient(ellipse, rgba(0, 220, 255, 0.18) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(7px);
    transform: translateX(-50%);
    animation: shadow-idle 5s ease-in-out infinite;
    pointer-events: none;
  }

  .scene:hover .shadow {
    animation: shadow-hover 2.2s ease-in-out infinite;
  }

  @keyframes shadow-idle {
    0%, 100% { transform: translateX(-50%) scaleX(1);    opacity: 0.6; }
    50%       { transform: translateX(-50%) scaleX(0.84); opacity: 0.35; }
  }

  @keyframes shadow-hover {
    0%, 100% { transform: translateX(-50%) scaleX(1.1);  opacity: 0.85; }
    40%       { transform: translateX(-50%) scaleX(0.7);  opacity: 0.30; }
    70%       { transform: translateX(-50%) scaleX(0.9);  opacity: 0.55; }
  }

  /* ─── Particles ─── */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    z-index: 1;
  }

  /* ── Always-on particles ── */
  .pi1  { width:3px; height:3px; background:#00dcff; left:18%; top:68%; animation: p-idle 6.0s ease-in-out 0.0s  infinite; }
  .pi2  { width:4px; height:4px; background:#ff3cbe; left:72%; top:62%; animation: p-idle 7.2s ease-in-out 1.4s  infinite; }
  .pi3  { width:3px; height:3px; background:#00dcff; left:44%; top:74%; animation: p-idle 5.5s ease-in-out 2.8s  infinite; }
  .pi4  { width:2px; height:2px; background:#ff3cbe; left:30%; top:58%; animation: p-idle 8.0s ease-in-out 0.7s  infinite; }
  .pi5  { width:4px; height:4px; background:#00dcff; left:62%; top:70%; animation: p-idle 6.8s ease-in-out 3.5s  infinite; }
  .pi6  { width:2px; height:2px; background:#ffffff; left:52%; top:66%; animation: p-idle 5.2s ease-in-out 1.9s  infinite; }
  .pi7  { width:3px; height:3px; background:#ff3cbe; left:82%; top:72%; animation: p-idle 7.6s ease-in-out 4.2s  infinite; }
  .pi8  { width:2px; height:2px; background:#00dcff; left:12%; top:60%; animation: p-idle 6.4s ease-in-out 0.4s  infinite; }

  /* ── Extra particles on hover ── */
  .ph1 { width:4px; height:4px; background:#00dcff; left:28%; top:66%; }
  .ph2 { width:3px; height:3px; background:#ff3cbe; left:65%; top:62%; }
  .ph3 { width:4px; height:4px; background:#00dcff; left:48%; top:70%; }

  .scene:hover .ph1 { animation: p-hover 2.8s ease-in-out 0.0s infinite; }
  .scene:hover .ph2 { animation: p-hover 3.2s ease-in-out 0.9s infinite; }
  .scene:hover .ph3 { animation: p-hover 2.5s ease-in-out 1.6s infinite; }

  @keyframes p-idle {
    0%   { transform: translateY(0)     translateX(0);    opacity: 0;    }
    12%  { opacity: 0.65; }
    88%  { opacity: 0.35; }
    100% { transform: translateY(-70px) translateX(8px);  opacity: 0;    }
  }

  @keyframes p-hover {
    0%   { transform: translateY(0)     translateX(0);    opacity: 0;    }
    12%  { opacity: 0.9;  }
    88%  { opacity: 0.55; }
    100% { transform: translateY(-95px) translateX(10px); opacity: 0;    }
  }
</style>
</head>
<body>
<div class="scene">

  <div class="glow-ring"></div>

  <!-- Always-on particles -->
  <div class="particle pi1"></div>
  <div class="particle pi2"></div>
  <div class="particle pi3"></div>
  <div class="particle pi4"></div>
  <div class="particle pi5"></div>
  <div class="particle pi6"></div>
  <div class="particle pi7"></div>
  <div class="particle pi8"></div>

  <!-- Hover particles -->
  <div class="particle ph1"></div>
  <div class="particle ph2"></div>
  <div class="particle ph3"></div>

  <div class="robot-wrapper">
    <img class="robot" src="mascot2.png" alt="Simtec Mascot">
  </div>

  <div class="shadow"></div>

</div>
<script>
  const wrapper = document.querySelector('.robot-wrapper');
  let dragging = false;
  let startX = 0;

  wrapper.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX;
    wrapper.classList.add('dragging');
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    // Max ±12 degrees, falls off with distance
    const angle = Math.max(-12, Math.min(12, dx * 0.06));
    wrapper.style.transform = `rotateZ(${angle}deg)`;
  });

  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    wrapper.classList.remove('dragging');
    wrapper.style.transform = 'rotateZ(0deg)';
  });
</script>
</body>
</html>
